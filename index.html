<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102525">
  <title>ماهذا؟</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e2f78a'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='sans-serif' font-size='25' font-weight='bold' fill='%23152c27'%3EAa%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=5">
  <script defer src="app.js?v=12"></script>
</head>
<body>
  <main id="experience" class="experience">
    <video id="camera" class="camera" autoplay muted playsinline aria-hidden="true"></video>
    <div class="shade" aria-hidden="true"></div>

    <header class="top">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">Aa</span>
        <h1>تعلّم بالكاميرا</h1>
      </div>
      <div class="top-actions">
        <button id="voice-settings" class="stop" type="button" aria-haspopup="dialog" hidden>الصوت</button>
        <button id="stop" class="stop" type="button" hidden>إيقاف الكاميرا</button>
      </div>
    </header>

    <div id="viewfinder" class="viewfinder" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
      <div class="lens"><span></span></div>
    </div>

    <div class="controls">
      <section id="result" class="result" aria-label="الكلمة بالإنجليزية" hidden>
        <div class="word-group" lang="en-US" dir="ltr">
          <strong id="word"></strong>
          <span id="sentence"></span>
        </div>
        <button id="replay" class="replay" type="button" aria-label="اسمع الكلمة" title="اسمع الكلمة">
          <span class="speaker" aria-hidden="true"></span>
        </button>
      </section>
      <p id="status" class="status" role="status" aria-live="polite">شغّل الكاميرا ووجّهها نحو غرض واحد.</p>
      <button id="action" class="action" type="button">شغّل الكاميرا</button>
      <noscript>فعّل JavaScript لاستخدام الكاميرا.</noscript>
    </div>
    <dialog id="voice-dialog" class="voice-dialog" aria-labelledby="voice-title">
      <form method="dialog">
        <h2 id="voice-title">صوت النطق</h2>
        <label for="voice-select">الصوت الإنجليزي</label>
        <select id="voice-select"></select>
        <p id="voice-note" class="voice-note" role="status" hidden></p>
        <div class="voice-actions">
          <button id="voice-preview" type="button">اسمع عيّنة</button>
          <button id="voice-done" value="save">تم</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
